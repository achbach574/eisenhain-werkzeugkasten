<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handout</title><link rel="stylesheet" href="./style.css?v=5">
<style>.thumbs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.thumbs img{height:64px;border:2px solid var(--line);border-radius:6px;cursor:pointer;background:#000}.thumbs img.on{border-color:var(--gold)}</style></head>
<body>
  <h1>Handout-Projektor</h1>
  <div class="muted" id="hInfo"></div>
  <div class="thumbs" id="hThumbs"></div>
  <div class="row" style="margin-top:8px">
    <button id="hPrev" style="flex:1;text-align:center">◀ Zurück</button>
    <button id="hNext" class="primary" style="flex:1;text-align:center">Weiter ▶</button>
  </div>
  <button id="hClose" class="ok" style="width:100%;margin-top:8px;text-align:center">Vom Fernseher nehmen</button>
  <script type="module" src="./handout.js?v=5"></script>
</body></html>
