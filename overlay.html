<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eisenhain Großanzeige</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #f3e9dc; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .veil { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(20,10,5,.55) 0%, rgba(10,5,2,.88) 75%); animation: fade .35s ease-out both; }
  .veil.dark { background: rgba(8,5,3,.9); }
  @keyframes fade { from { opacity: 0 } }
  .content { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2vh; text-align: center; }
  .cin { font-family: "Cinzel", Georgia, serif; font-weight: 900; letter-spacing: .04em; }
  .who { font-family: "Cinzel", Georgia, serif; font-size: 3.4vh; color: #e8c877; text-shadow: 0 2px 8px #000; }
  .sub { font-size: 2.6vh; color: #d9c8b0; text-shadow: 0 2px 6px #000; max-width: 70vw; }

  /* Würfel */
  .die { width: 38vh; height: 38vh; filter: drop-shadow(0 2.5vh 3vh rgba(0,0,0,.8)); }
  .die.rolling { animation: tumble 1.25s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes tumble {
    0%   { transform: translate(-60vw, -25vh) rotate(-540deg) scale(.5); }
    45%  { transform: translate(-8vw, 4vh) rotate(-120deg) scale(1.05); }
    62%  { transform: translate(4vw, -6vh) rotate(-40deg) scale(.95); }
    80%  { transform: translate(1vw, 1vh) rotate(8deg) scale(1.02); }
    100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  }
  .die.landed { animation: thud .35s ease-out; }
  @keyframes thud { 0% { transform: scale(1.12) } 100% { transform: scale(1) } }
  .num { font-family: "Cinzel", Georgia, serif; font-weight: 900; fill: #f6e7c4; stroke: #2a160b; stroke-width: 1.4; paint-order: stroke; }
  .result { font-size: 6vh; text-shadow: 0 3px 10px #000; }
  .detail { font-size: 2.5vh; color: #cdb99d; text-shadow: 0 2px 6px #000; }
  .verdict { font-size: 5vh; padding: .6vh 3vh; border-radius: 1.4vh; border: .4vh solid; text-shadow: 0 2px 6px #000; }
  .verdict.erfolg { color: #9fe39c; border-color: #3f8f3a; background: rgba(20,60,18,.6); }
  .verdict.fehlschlag { color: #ff9b8a; border-color: #a33a2a; background: rgba(70,15,10,.6); }
  .crit { font-size: 13vh; line-height: 1; animation: slam .5s cubic-bezier(.2,1.6,.4,1) both; }
  .crit.pump { color: #ffd34d; text-shadow: 0 0 3vh #ff9d00, 0 0 8vh #ff6a00, 0 .6vh 0 #6b3a00; }
  .crit.kater { color: #ff5a3c; text-shadow: 0 0 3vh #a00, 0 .6vh 0 #300; animation: slam .5s cubic-bezier(.2,1.6,.4,1) both, shake .12s linear .5s 8; }
  @keyframes slam { from { transform: scale(3); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-1vh) } 75% { transform: translateX(1vh) } }
  .sparks { position: fixed; inset: 0; pointer-events: none; }
  .spark { position: absolute; left: 50%; top: 45%; width: 1vh; height: 1vh; border-radius: 50%; background: #ffcf5a; box-shadow: 0 0 1.5vh #ff8a00; animation: fly 1.2s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0 } }
  .hidden { opacity: 0; }
  .appear { animation: appear .4s ease-out both; }
  @keyframes appear { from { opacity: 0; transform: translateY(2vh) } }

  /* Shakes */
  .cups { display: flex; gap: min(2vh, 1.4vw); }
  .cup { width: min(14vh, 12.5vw); height: min(18vh, 16vw); border-radius: 1.6vh 1.6vh 4vh 4vh; background: linear-gradient(180deg,#3b2a1f,#20150f); border: .4vh solid #5a4330;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6vh; font-size: min(7vh, 6vw); transition: transform .1s, border-color .1s, box-shadow .1s; }
  .cup small { font-size: 2.2vh; font-family: "Cinzel", serif; color: #c9b597; }
  .cup.lit { border-color: #ffd34d; box-shadow: 0 0 4vh #ffb000; transform: translateY(-1.5vh) scale(1.08); }
  .cup.win { border-color: #ffd34d; box-shadow: 0 0 6vh #ffb000, inset 0 0 3vh rgba(255,200,80,.3); transform: translateY(-2.5vh) scale(1.18); }
  .shname { font-size: min(6vh, 5.5vw); color: #ffd98a; text-shadow: 0 0 2vh #b0600088, 0 3px 8px #000; }

  /* Handout */
  .handout { max-width: 86vw; max-height: 82vh; object-fit: contain; filter: drop-shadow(0 2vh 4vh rgba(0,0,0,.9)); animation: lift .45s cubic-bezier(.2,1.2,.4,1) both; }
  @keyframes lift { from { transform: scale(.7) rotate(-3deg); opacity: 0 } }
  .page { font-family: "Cinzel", serif; font-size: 2.6vh; color: #e8c877; }

  /* Sprechblase */
  .goblin { display: flex; align-items: flex-end; gap: 2vh; }
  .goblin img { height: 42vh; filter: drop-shadow(0 2vh 3vh rgba(0,0,0,.85)); animation: hop .5s ease-out both; }
  @keyframes hop { 0% { transform: translateY(20vh) } 70% { transform: translateY(-2vh) } 100% { transform: none } }
  .bubble { position: relative; background: #fffaf0; color: #1d120b; font-family: "Caveat", cursive; font-size: 8vh; line-height: 1.05; padding: 3vh 4vh; border-radius: 4vh; max-width: 48vw; margin-bottom: 26vh;
            border: .5vh solid #1d120b; box-shadow: 0 1.5vh 3vh rgba(0,0,0,.7); animation: pop .35s .25s cubic-bezier(.2,1.6,.4,1) both; }
  .bubble::after { content: ""; position: absolute; left: -3.6vh; bottom: 3vh; border: 2vh solid transparent; border-right: 3.6vh solid #1d120b; }
  @keyframes pop { from { transform: scale(0); opacity: 0 } }
  .event-title { font-size: 11vh; color: #ff7a4d; text-shadow: 0 0 3vh #a32000, 0 .6vh 0 #2a0b00; animation: slam .45s cubic-bezier(.2,1.6,.4,1) both; }
  .event-img { height: 26vh; filter: grayscale(.3) drop-shadow(0 2vh 3vh #000); animation: squash .7s .2s ease-in both; }
  @keyframes squash { 60% { transform: scaleY(1) } 75% { transform: scaleY(.25) scaleX(1.4); filter: hue-rotate(-40deg) saturate(3) brightness(1.3) } 100% { transform: scaleY(.25) scaleX(1.4); opacity: .0 } }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./overlay.js?v=6"></script>
</body>
</html>
